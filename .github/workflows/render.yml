# Cloud render on GitHub Actions (free for public repos): the video is split into chunks rendered in parallel, each
# chunk carrying its own lossless audio (pcm); the join encodes audio once and attaches final.mp4 to the job release.
# scripts/cloud-render.mjs uploads the job (public/ as job.tar), starts this, downloads final.mp4, deletes the release.
name: render
on:
  workflow_dispatch:
    inputs:
      job: {description: "release tag holding job.tar", required: true}
      frames: {description: "total frames", required: true}
      chunks: {description: "parallel machines", required: true, default: "12"}
      comp: {description: "composition id", required: false, default: "Explainer"}
      props: {description: "input props JSON", required: false, default: "{}"}
permissions:
  contents: write
concurrency: {group: "${{ inputs.job }}"}
env:
  GH_TOKEN: ${{ github.token }}

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.m.outputs.list }}
    steps:
      - id: m
        run: echo "list=$(node -e 'console.log(JSON.stringify([...Array(+process.argv[1]).keys()]))' ${{ inputs.chunks }})" >> "$GITHUB_OUTPUT"

  video:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      matrix: {chunk: "${{ fromJson(needs.setup.outputs.list) }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci --ignore-scripts
      - run: gh release download "${{ inputs.job }}" -p job.tar -R "$GITHUB_REPOSITORY" && tar -xf job.tar && rm job.tar
      - run: npx remotion browser ensure
      - name: render chunk
        env: {PROPS: "${{ inputs.props }}"}
        run: |
          N=${{ inputs.chunks }}; F=${{ inputs.frames }}; i=${{ matrix.chunk }}
          a=$(( i * F / N )); b=$(( (i + 1) * F / N - 1 ))
          # each chunk carries its own lossless audio (pcm), so no separate audio render is needed
          printf '%s' "$PROPS" > props.json
          npx remotion render "${{ inputs.comp }}" "out/part-$(printf %03d $i).mkv" --props=props.json --frames=$a-$b --codec=h264-mkv --audio-codec=pcm-16 --enforce-audio-track --crf=18 --concurrency=100% --log=error
      - uses: actions/upload-artifact@v4
        with: {name: "part-${{ matrix.chunk }}", path: out/, retention-days: 1}

  merge:
    needs: video
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {path: parts, merge-multiple: true}
      - run: |
          which ffmpeg || (sudo apt-get update -q && sudo apt-get install -yq ffmpeg)
          for f in $(ls parts/part-*.mkv | sort); do echo "file '$PWD/$f'"; done > list.txt
          ffmpeg -v error -f concat -safe 0 -i list.txt -c:v copy -c:a aac -b:a 320k -movflags +faststart final.mp4
          gh release upload "${{ inputs.job }}" final.mp4 -R "$GITHUB_REPOSITORY" --clobber
